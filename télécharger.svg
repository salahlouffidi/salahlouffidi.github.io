<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg" onload="copilotAlert()" onclick="copilotAlert()">
  <script type="application/ecmascript"><![CDATA[
    function copilotAlert() {
      alert("This is from Copilot ⚽");
    }
  ]]></script>

  <!-- Stadium background -->
  <rect width="100%" height="100%" fill="#2e8b57" />

  <!-- Field -->
  <rect x="100" y="50" width="400" height="300" fill="#3cb371" stroke="white" stroke-width="4" />

  <!-- Center circle -->
  <circle cx="300" cy="200" r="40" stroke="white" stroke-width="3" fill="none" />
  <circle cx="300" cy="200" r="2" fill="white" />

  <!-- Goal areas -->
  <rect x="100" y="150" width="40" height="100" stroke="white" stroke-width="3" fill="none" />
  <rect x="460" y="150" width="40" height="100" stroke="white" stroke-width="3" fill="none" />

  <!-- Goals -->
  <rect x="90" y="175" width="10" height="50" fill="#ffffff" />
  <rect x="500" y="175" width="10" height="50" fill="#ffffff" />

  <!-- Stands -->
  <rect x="50" y="30" width="500" height="20" fill="#808080" />
  <rect x="50" y="350" width="500" height="20" fill="#808080" />
  <rect x="80" y="50" width="20" height="300" fill="#808080" />
  <rect x="500" y="50" width="20" height="300" fill="#808080" />

  <!-- Decorative lights -->
  <circle cx="70" cy="20" r="5" fill="yellow" />
  <circle cx="530" cy="20" r="5" fill="yellow" />
  <circle cx="70" cy="380" r="5" fill="yellow" />
  <circle cx="530" cy="380" r="5" fill="yellow" />
</svg>
