<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>Smart TV Stream</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090d;
      --panel: rgba(18, 21, 30, 0.88);
      --line: rgba(255, 255, 255, 0.16);
      --text: #f6f8ff;
      --muted: #a8b1c7;
      --accent: #37d4ff;
      --accent-2: #8bffbb;
      --danger: #ff6262;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 72px;
      padding: max(14px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 14px max(18px, env(safe-area-inset-left));
      background: linear-gradient(180deg, rgba(8, 9, 13, 0.92), rgba(8, 9, 13, 0));
      opacity: 1;
      transition: opacity 180ms ease;
    }

    body.hide-ui .topbar,
    body.hide-ui .hint {
      opacity: 0;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .signal {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 24px rgba(139, 255, 187, 0.75);
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(18px, 2.1vw, 31px);
      font-weight: 760;
      letter-spacing: 0;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex: 0 0 auto;
    }

    button,
    a.button {
      display: inline-grid;
      place-items: center;
      width: 56px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      outline: none;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    button:focus-visible,
    a.button:focus-visible,
    button:hover,
    a.button:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: rgba(55, 212, 255, 0.18);
    }

    svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(55, 212, 255, 0.12), transparent 35%),
        #050608;
    }

    .frame-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .shade {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07), inset 0 0 90px rgba(0, 0, 0, 0.45);
    }

    .hint {
      position: fixed;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 5;
      max-width: min(680px, calc(100vw - 36px));
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(8, 9, 13, 0.76);
      color: var(--muted);
      font-size: clamp(13px, 1.35vw, 18px);
      line-height: 1.35;
      transition: opacity 180ms ease;
    }

    .fallback {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: none;
      place-items: center;
      padding: 28px;
      background: rgba(5, 6, 8, 0.82);
      text-align: center;
    }

    .fallback.show {
      display: grid;
    }

    .fallback-inner {
      width: min(720px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(18, 21, 30, 0.94);
    }

    .fallback h2 {
      margin: 0 0 12px;
      font-size: clamp(24px, 4vw, 44px);
      letter-spacing: 0;
    }

    .fallback p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 22px);
      line-height: 1.4;
    }

    .fallback .wide {
      width: auto;
      min-width: 210px;
      padding: 0 18px;
      font-size: 18px;
      font-weight: 720;
    }

    @media (max-width: 700px) {
      .topbar {
        min-height: 64px;
      }

      .actions {
        gap: 8px;
      }

      button,
      a.button {
        width: 48px;
        height: 44px;
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Smart TV stream player">
    <div class="frame-wrap">
      <iframe
        id="player"
        title="Streaming player"
        src="https://new.poiy.online/albaplayer/max1/"
        referrerpolicy="no-referrer"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        sandbox="allow-forms allow-pointer-lock allow-presentation allow-same-origin allow-scripts">
      </iframe>
      <div class="shade" aria-hidden="true"></div>
    </div>
  </main>

  <header class="topbar" aria-label="Player controls">
    <div class="brand">
      <span class="signal" aria-hidden="true"></span>
      <h1>MAX 1</h1>
    </div>
    <nav class="actions" aria-label="Stream actions">
      <button type="button" id="reload" title="Reload stream" aria-label="Reload stream">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button type="button" id="fullscreen" title="Fullscreen" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <a class="button" href="https://new.poiy.online/albaplayer/max1/" target="_blank" rel="noreferrer" title="Open direct" aria-label="Open direct">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
      </a>
    </nav>
  </header>

  <aside class="hint" aria-live="polite">
    OK / Enter shows controls. Backspace hides controls. Use Reload if the stream stalls.
  </aside>

  <section class="fallback" id="fallback" aria-hidden="true">
    <div class="fallback-inner">
      <h2>Open Direct</h2>
      <p>The stream host may block embedded playback on some Smart TV browsers.</p>
      <a class="button wide" href="https://new.poiy.online/albaplayer/max1/" target="_blank" rel="noreferrer">Open Stream</a>
    </div>
  </section>

  <script>
    const STREAM_URL = "https://new.poiy.online/albaplayer/max1/";
    const player = document.querySelector("#player");
    const reloadButton = document.querySelector("#reload");
    const fullscreenButton = document.querySelector("#fullscreen");
    const fallback = document.querySelector("#fallback");
    let hideTimer = 0;

    function showUi() {
      document.body.classList.remove("hide-ui");
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => document.body.classList.add("hide-ui"), 5200);
    }

    function reloadStream() {
      player.src = "about:blank";
      window.setTimeout(() => {
        player.src = STREAM_URL + (STREAM_URL.includes("?") ? "&" : "?") + "tv_reload=" + Date.now();
      }, 150);
      showUi();
    }

    async function enterFullscreen() {
      const target = document.documentElement;
      if (document.fullscreenElement) {
        await document.exitFullscreen().catch(() => {});
      } else if (target.requestFullscreen) {
        await target.requestFullscreen().catch(() => {});
      }
      showUi();
    }

    reloadButton.addEventListener("click", reloadStream);
    fullscreenButton.addEventListener("click", enterFullscreen);
    document.addEventListener("pointermove", showUi, { passive: true });
    document.addEventListener("click", showUi);

    document.addEventListener("keydown", (event) => {
      const key = event.key;
      if (key === "Enter" || key === "OK" || key === " ") {
        showUi();
      }
      if (key === "Backspace" || key === "Escape") {
        document.body.classList.add("hide-ui");
      }
      if (key.toLowerCase() === "r" || key === "MediaPlayPause") {
        reloadStream();
      }
      if (key.toLowerCase() === "f") {
        enterFullscreen();
      }
    });

    window.setTimeout(showUi, 250);
    window.setTimeout(() => {
      if (player.contentWindow) return;
      fallback.classList.add("show");
      fallback.setAttribute("aria-hidden", "false");
    }, 4500);
  </script>
</body>
</html>
