<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Senegal vs France - Player</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .player-wrap {
      position: fixed;
      inset: 0;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
    .note {
      position: fixed;
      left: 10px;
      bottom: 10px;
      color: white;
      background: rgba(0,0,0,.55);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 2;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="player-wrap">
    <iframe
      src="https://24.streemach.site/albaplayer/live3/"
      title="Senegal vs France player"
      loading="eager"
      referrerpolicy="no-referrer"
      allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
      allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
    </iframe>
  </div>
  <div class="note">Sandboxed player only</div>
</body>
</html>
