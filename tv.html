<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; frame-src https://24.streemach.site; img-src 'self' data:; base-uri 'none'; form-action 'none';">
  <title>Louffi TV</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .player-wrap {
      position: fixed;
      inset: 0;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="player-wrap">
    <iframe
      id="player"
      src="https://24.streemach.site/albaplayer/live3/"
      title="Live player"
      loading="eager"
      referrerpolicy="no-referrer"
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      allowfullscreen
      sandbox="allow-scripts allow-presentation">
    </iframe>
  </div>
</body>
</html>
