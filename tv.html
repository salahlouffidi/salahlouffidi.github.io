<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Louffi TV</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    
    .player-wrap {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background: linear-gradient(to bottom, rgba(0,0,0,.9), transparent);
      padding: 30px 40px;
      color: white;
      z-index: 10;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header-left {
      flex: 1;
    }
    
    .title {
      font-size: 72px;
      font-weight: bold;
      margin-bottom: 8px;
      text-shadow: 3px 3px 6px rgba(0,0,0,.8);
      letter-spacing: 3px;
    }
    
    .video-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
    
    .note {
      position: fixed;
      right: 30px;
      bottom: 30px;
      color: #64c8ff;
      background: rgba(0,0,0,.8);
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 18px;
      z-index: 5;
      border: 2px solid rgba(100, 200, 255, 0.4);
      box-shadow: 0 4px 15px rgba(100, 200, 255, 0.2);
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
    }
    
    .status {
      position: fixed;
      left: 30px;
      bottom: 30px;
      color: #00ff00;
      background: rgba(0,0,0,.8);
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 18px;
      z-index: 5;
      border: 2px solid rgba(0,255,0,.4);
      font-family: monospace;
      box-shadow: 0 4px 15px rgba(0,255,0,.2);
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
    }
    
    @media (max-width: 1920px) {
      .title {
        font-size: 56px;
      }
    }
    
    @media (max-width: 1280px) {
      .title {
        font-size: 42px;
      }
      .note, .status {
        font-size: 16px;
        padding: 10px 15px;
      }
    }
  </style>
</head>
<body>
  <div class="player-wrap">
    <div class="header">
      <div class="header-left">
        <div class="title">🎬 LOUFFI TV</div>
      </div>
    </div>
    
    <div class="video-container">
      <iframe
        id="player"
        src="https://24.streemach.site/albaplayer/live3/"
        title="Live player"
        loading="eager"
        referrerpolicy="no-referrer"
        allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
        sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
      </iframe>
    </div>
  </div>
  
  <div class="status" id="status">Ready</div>
  <div class="note">Smart TV Optimized • Sandboxed Player</div>
  
  <script>
    const statusEl = document.getElementById('status');
    
    // Initial state
    statusEl.textContent = 'Ready';
  </script>
</body>
</html>
